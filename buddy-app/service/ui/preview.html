<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><meta name="learnflow-preview-nonce" content="__LEARNFLOW_PREVIEW_NONCE__"><title>LearnFlow · 本地协议预览</title><style>
:root{font:16px/1.6 'Segoe UI','Microsoft YaHei',sans-serif;color:#292622;background:#f1efec}*{box-sizing:border-box}body{margin:0}button{font:inherit;cursor:pointer;border:1px solid #ddd8d0;border-radius:10px;min-height:42px;padding:9px 15px;background:white;color:inherit}button:disabled{opacity:.6;cursor:wait}button:focus-visible{outline:3px solid #ee782f;outline-offset:3px}button.primary{background:#eb7731;border-color:#eb7731;color:white}header{padding:17px 28px;display:flex;align-items:center;justify-content:space-between;gap:16px;background:#fff;border-bottom:1px solid #e4ddd4}h1{font-size:19px;margin:0}.hint{font-size:14px;color:#756b60;margin:2px 0 0}.profiles{display:flex;gap:7px;flex-wrap:wrap}.profiles button[aria-pressed=true]{border-color:#edb387;background:#fff0e3;color:#9d4b1b}.layout{max-width:1360px;margin:auto;padding:23px;display:grid;gap:17px}.canvas{border:1px solid #e4ddd4;border-radius:22px;overflow:hidden;background:white;box-shadow:0 6px 35px #57492908}iframe{width:100%;height:920px;display:block;border:0}.consent{max-width:580px;padding:55px 35px;text-align:left;margin:auto}.consent h2{font-size:29px;line-height:1.5}.consent p{line-height:1.8;margin:20px 0}.status{font-size:14px;color:#63574b;padding:0 4px;display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}.host-event{background:white;border:1px solid #e4ddd4;border-radius:14px;padding:18px 22px}.host-event h2{font-size:16px;margin:0 0 8px}.host-event pre{white-space:pre-wrap;overflow-wrap:anywhere;font:15px/1.7 inherit;margin:0}.host-event p{color:#756b60;font-size:14px;margin:12px 0 0}.error{color:#974c27;white-space:pre-wrap}details{padding:0 3px}summary{cursor:pointer;font-size:14px;color:#6f6256}details pre{font-size:13px;white-space:pre-wrap}.hidden{display:none}@media(max-width:700px){header{padding:16px;flex-wrap:wrap}.layout{padding:12px}.profiles button{font-size:14px;padding:8px 11px}.canvas{border-radius:17px}.consent{padding:32px 22px}iframe{height:950px}}
</style></head><body><header><div><h1>LearnFlow 本地协议预览</h1><p class="hint">数据来自本机服务。腾讯客户端与真实模型尚需正式预览验证。</p></div><div class="profiles" aria-label="开发测试身份"><button data-profile="learner" aria-pressed="true">学习者</button><button data-profile="teacher" aria-pressed="false">教师</button><button data-profile="second-learner" aria-pressed="false">另一位同学</button></div></header><main class="layout"><div class="status"><span id="state">等待你打开</span><span id="calls">尚未调用服务</span></div><div class="canvas"><section id="consent" class="consent"><h2>先在这里，把学习流程走一遍。</h2><p>使用独立的本地测试身份，查看卡片、保存资料、邀请同学与核验作业。这里不会读取你的 Buddy 登录信息，也不会调用模型。</p><button id="open" class="primary">同意并打开本地预览</button><p id="error" class="error" role="alert"></p></section><iframe id="panel" title="LearnFlow 学习工作台" sandbox="allow-scripts allow-downloads allow-popups" class="hidden"></iframe></div><section id="host-event" class="host-event hidden"><h2>面板交给学习助手的消息</h2><pre id="message"></pre><p>本地预览只验证消息回传，不生成模型回答。正式 Buddy 预览中由宿主继续对话。</p></section><details><summary>查看协议检查记录</summary><pre id="protocol">尚未初始化</pre></details></main><script>
(() => {
 'use strict';const $=id=>document.getElementById(id),nonce=document.querySelector('meta[name="learnflow-preview-nonce"]').content;let token='',profile='learner',rpcId=0,calls=0,generation=0,frameWindow=null,connected=false;const logs=[];
 const labels={learner:'学习者',teacher:'教师','second-learner':'另一位同学'};
 function log(text){logs.push(text);$('protocol').textContent=logs.slice(-35).join('\n')}
 async function request(method,params={},credential=token){const id=++rpcId;const r=await fetch('/mcp',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json, text/event-stream',Authorization:'Bearer '+credential},body:JSON.stringify({jsonrpc:'2.0',id,method,params})});if(!r.ok)throw Error(`本机服务返回 ${r.status}，请重新打开预览。`);const data=await r.json();if(data.error)throw Error(data.error.message);calls++;$('calls').textContent=`${calls} 次真实服务请求`;log(`${method}${params.name?' / '+params.name:''}${params.arguments?.action?' / '+params.arguments.action:''}`);return data.result}
 function response(target,id,result,error){target?.postMessage({jsonrpc:'2.0',id,...(error?{error:{code:-32000,message:error}}:{result})},'*')}
 async function launch(){if(!['127.0.0.1','localhost','[::1]'].includes(location.hostname))throw Error('本地测试身份只允许在本机使用。');const epoch=++generation;connected=false;$('error').textContent='';$('state').textContent='正在连接本机服务…';$('panel').classList.add('hidden');$('panel').removeAttribute('srcdoc');$('panel').src='about:blank';frameWindow=null;const r=await fetch('/dev/session',{method:'POST',headers:{'Content-Type':'application/json','X-LearnFlow-Preview-Nonce':nonce},body:JSON.stringify({profile})});if(!r.ok)throw Error(`无法建立本地预览身份（${r.status}）。请刷新预览页。`);const session=await r.json();if(epoch!==generation)return;token=session.token;await request('initialize',{protocolVersion:'2025-11-25',capabilities:{extensions:{'io.modelcontextprotocol/ui':{mimeTypes:['text/html;profile=mcp-app']}}},clientInfo:{name:'LearnFlow local protocol preview',version:'0.3.0'}});const resources=await request('resources/read',{uri:'ui://learnflow/workspace.html'});const html=resources.contents?.find(item=>item.mimeType?.includes('text/html'))?.text;if(!html)throw Error('服务没有返回学习面板。');if(epoch!==generation)return;const panelURL=URL.createObjectURL(new Blob([html],{type:'text/html'}));$('panel').src=panelURL;$('panel').addEventListener('load',()=>URL.revokeObjectURL(panelURL),{once:true});frameWindow=$('panel').contentWindow;$('panel').classList.remove('hidden');$('consent').classList.add('hidden');$('state').textContent=`${session.actor?.label||labels[profile]} · 本机测试身份`;document.querySelectorAll('[data-profile]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.profile===profile)));connected=true}
 window.addEventListener('message',async event=>{if(event.source!==frameWindow||event.data?.jsonrpc!=='2.0')return;const message=event.data,target=frameWindow,epoch=generation,credential=token;if(!message.method)return;try{if(message.method==='ui/initialize'){log('ui/initialize / standard MCP Apps handshake');response(target,message.id,{protocolVersion:'2026-01-26',hostInfo:{name:'LearnFlow local protocol preview',version:'0.3.0'},hostCapabilities:{serverTools:{},serverResources:{},updateModelContext:{},openLinks:{},logging:{}},hostContext:{theme:'light',displayMode:'inline',availableDisplayModes:['inline'],containerDimensions:{width:1200,maxHeight:1800}}});return}if(message.method==='ui/notifications/initialized'){log('ui/notifications/initialized');return}if(message.method==='ui/notifications/size-changed'){const height=Number(message.params?.height);if(Number.isFinite(height))$('panel').style.height=Math.min(950,Math.max(700,height))+'px';return}if(message.method==='tools/call'){const result=await request('tools/call',message.params,credential);if(epoch===generation)response(target,message.id,result);return}if(message.method==='ui/message'){$('host-event').classList.remove('hidden');$('message').textContent=(message.params?.content||[]).filter(x=>x.type==='text').map(x=>x.text).join('\n');log('ui/message / received, no model response simulated');response(target,message.id,{});return}if(message.method==='ui/update-model-context'){log('ui/update-model-context / received, local preview only');response(target,message.id,{});return}if(message.method==='ping'){response(target,message.id,{});return}if(message.method==='notifications/message'){log('host log received');return}if(message.id!=null)response(target,message.id,null,'本地预览尚未实现此宿主能力：'+message.method)}catch(error){if(message.id!=null&&epoch===generation)response(target,message.id,null,error.message);$('state').textContent=error.message}});
 $('open').addEventListener('click',async()=>{$('open').disabled=true;try{await launch()}catch(error){$('error').textContent=error.message;$('state').textContent='连接未完成'}finally{$('open').disabled=false}});
 document.querySelectorAll('[data-profile]').forEach(b=>b.addEventListener('click',async()=>{profile=b.dataset.profile;if(!connected){document.querySelectorAll('[data-profile]').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.profile===profile)));return}b.disabled=true;try{await launch()}catch(error){$('state').textContent=error.message}finally{b.disabled=false}}));
})();
</script></body></html>
